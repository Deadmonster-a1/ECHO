name: ECHO Android CI/CD Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release ECHO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: own-app

      - name: Run JVM Unit Tests
        run: ./gradlew test
        working-directory: own-app

      - name: Run Android Lint Analysis
        run: ./gradlew lintRelease
        working-directory: own-app

      - name: Ensure Android Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK & App Bundle
        run: ./gradlew assembleRelease bundleRelease
        working-directory: own-app
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate Checksums
        run: |
          mkdir -p artifacts
          cp own-app/app/build/outputs/apk/release/app-release.apk artifacts/echo-release.apk
          cp own-app/app/build/outputs/bundle/release/app-release.aab artifacts/echo-release.aab
          cp own-app/app/build/outputs/mapping/release/mapping.txt artifacts/mapping.txt || true
          cd artifacts
          sha256sum echo-release.apk > checksums.txt
          sha256sum echo-release.aab >> checksums.txt
          cat checksums.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ECHO Music Player ${{ github.ref_name || inputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/echo-release.apk
            artifacts/echo-release.aab
            artifacts/checksums.txt
            artifacts/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
