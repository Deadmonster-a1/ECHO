name: ECHO Android CI/CD Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release ECHO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: own-app

      - name: Run JVM Unit Tests
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" -Dkotlin.daemon.jvmargs="-Xmx2048m" testDebugUnitTest
        working-directory: own-app

      - name: Run Android Lint Analysis
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" lintRelease || true
        working-directory: own-app

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::warning::KEYSTORE_BASE64 secret missing; skipping automated GitHub Release upload so a debug-signed APK is never published."
            else
              echo "::warning::KEYSTORE_BASE64 secret missing; APK will be debug-signed."
            fi
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/echo-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/echo-release.jks" >> "$GITHUB_ENV"
          echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" -Dkotlin.daemon.jvmargs="-Xmx2048m" assembleRelease
        working-directory: own-app

      - name: Generate Checksums
        run: |
          mkdir -p artifacts
          cp own-app/app/build/outputs/apk/release/app-release.apk artifacts/echo.apk
          cp own-app/app/build/outputs/mapping/release/mapping.txt artifacts/mapping.txt || true
          cd artifacts
          sha256sum echo.apk > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && env.HAS_RELEASE_KEYSTORE == 'true'
        with:
          name: ECHO Music Player ${{ github.ref_name || inputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/echo.apk
            artifacts/checksums.txt
            artifacts/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
