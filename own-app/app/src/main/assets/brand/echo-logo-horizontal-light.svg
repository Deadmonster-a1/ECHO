<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="hRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8C9FF"/>
      <stop offset="35%" stop-color="#A79BFF"/>
      <stop offset="70%" stop-color="#FF9C88"/>
      <stop offset="100%" stop-color="#FFB3A3"/>
    </linearGradient>
    <linearGradient id="hRibbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9C88"/>
      <stop offset="50%" stop-color="#A79BFF"/>
      <stop offset="100%" stop-color="#A8C9FF"/>
    </linearGradient>
    <radialGradient id="hBubble" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#A79BFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF9C88" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="hGlow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Left: Stylized Liquid 'e' Symbol (scaled to fit ~180x180 at x=30, y=30) -->
  <g transform="translate(30, 20) scale(0.38)">
    <circle cx="256" cy="256" r="140" fill="#A79BFF" opacity="0.18" filter="url(#hGlow)"/>
    <path d="M 170 330 C 130 330, 95 295, 95 255 C 95 235, 110 220, 130 220 C 150 220, 160 235, 175 255 C 190 275, 220 295, 260 295 C 315 295, 360 255, 360 200 C 360 145, 315 105, 255 105 C 175 105, 120 165, 120 255 C 120 345, 185 410, 280 410 C 340 410, 395 380, 435 340 C 445 330, 440 315, 425 315 C 410 315, 395 325, 380 335 C 350 355, 315 365, 275 365 C 205 365, 165 315, 165 255 C 165 240, 170 225, 180 215 C 200 195, 235 185, 270 185 C 325 185, 365 215, 365 255 C 365 305, 315 330, 255 330 C 220 330, 195 320, 170 330 Z" fill="url(#hRibbon1)"/>
    <path d="M 255 105 C 315 105, 360 145, 360 200 C 360 240, 335 270, 290 280 C 250 290, 205 280, 175 255 C 200 210, 245 185, 290 185 C 325 185, 350 200, 350 220 C 350 240, 320 255, 280 255 C 240 255, 210 240, 205 220 C 215 160, 260 115, 320 110 C 300 106, 275 105, 255 105 Z" fill="url(#hRibbon2)" opacity="0.95"/>
    <path d="M 140 185 C 170 130, 215 110, 265 110 C 320 110, 355 140, 355 185" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <circle cx="115" cy="240" r="16" fill="url(#hBubble)"/>
    <circle cx="430" cy="305" r="14" fill="url(#hBubble)"/>
  </g>

  <!-- Right: Wordmark 'echo' + Tagline 'Feel the sound.' -->
  <g transform="translate(245, 130)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="82" fill="#101016" letter-spacing="-2px">echo</text>
    <text y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#777680" letter-spacing="0.5px">Feel the sound.</text>
  </g>
</svg>