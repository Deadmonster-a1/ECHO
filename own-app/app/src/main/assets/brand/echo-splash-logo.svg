<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="sRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8C9FF"/>
      <stop offset="35%" stop-color="#A79BFF"/>
      <stop offset="70%" stop-color="#FF9C88"/>
      <stop offset="100%" stop-color="#FFB3A3"/>
    </linearGradient>
    <linearGradient id="sRibbonInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9C88"/>
      <stop offset="50%" stop-color="#A79BFF"/>
      <stop offset="100%" stop-color="#A8C9FF"/>
    </linearGradient>
    <filter id="sGlow">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Pulsing Aura -->
  <circle cx="300" cy="260" r="170" fill="#A79BFF" opacity="0.18" filter="url(#sGlow)"/>
  <circle cx="300" cy="260" r="110" fill="#FF9C88" opacity="0.15" filter="url(#sGlow)"/>

  <!-- Centered Liquid 'e' Symbol (x ~ 120, y ~ 80, scale ~ 0.70) -->
  <g transform="translate(120, 70) scale(0.70)">
    <path d="M 170 330 C 130 330, 95 295, 95 255 C 95 235, 110 220, 130 220 C 150 220, 160 235, 175 255 C 190 275, 220 295, 260 295 C 315 295, 360 255, 360 200 C 360 145, 315 105, 255 105 C 175 105, 120 165, 120 255 C 120 345, 185 410, 280 410 C 340 410, 395 380, 435 340 C 445 330, 440 315, 425 315 C 410 315, 395 325, 380 335 C 350 355, 315 365, 275 365 C 205 365, 165 315, 165 255 C 165 240, 170 225, 180 215 C 200 195, 235 185, 270 185 C 325 185, 365 215, 365 255 C 365 305, 315 330, 255 330 C 220 330, 195 320, 170 330 Z" fill="url(#sRibbon)"/>
    <path d="M 255 105 C 315 105, 360 145, 360 200 C 360 240, 335 270, 290 280 C 250 290, 205 280, 175 255 C 200 210, 245 185, 290 185 C 325 185, 350 200, 350 220 C 350 240, 320 255, 280 255 C 240 255, 210 240, 205 220 C 215 160, 260 115, 320 110 C 300 106, 275 105, 255 105 Z" fill="url(#sRibbonInner)" opacity="0.95"/>
    <path d="M 140 185 C 170 130, 215 110, 265 110 C 320 110, 355 140, 355 185" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <circle cx="115" cy="240" r="16" fill="#A8C9FF" opacity="0.85"/>
    <circle cx="430" cy="305" r="14" fill="#FF9C88" opacity="0.85"/>
    <circle cx="390" cy="140" r="8" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Centered Typography -->
  <g transform="translate(300, 480)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="78" fill="#101016" letter-spacing="-2px">echo</text>
    <text y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="22" fill="#777680" letter-spacing="1px">Feel the sound.</text>
  </g>
</svg>